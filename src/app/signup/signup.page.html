<ion-content class="ion-padding">
  <div class="signup-container">

    <div class="ion-text-left">
      <ion-button 
      routerLink="/welcome" 
      fill="clear" 
      size="medium" 
      style="font-weight: 300; text-transform: capitalize;">
        Cerrar
      </ion-button>
    </div>

    <h1 class="ion-padding-bottom ion-text-center">Crear cuenta</h1>

    <div 
    class="ion-margin-bottom ion-justify-content-center" 
    style="display: flex;">
      <ion-avatar 
      class="avatar"
        style="width: 120px; height: 120px; background: var(--ion-color-light); display: flex; align-items: center; justify-content: center; border-radius: 50%;">
        <ion-icon 
        name="person-outline" 
        style="font-size: 60px; color: var(--ion-color-medium);"></ion-icon>
      </ion-avatar>
    </div>

    <div 
    class="form-section">
      <ion-grid 
      class="ion-no-padding">
        <ion-row>
          <ion-col 
          size="6" 
          class="ion-padding-end">
            <ion-input 
            label="Nombre" 
            [(ngModel)]="name"
            label-placement="floating" 
            fill="outline" 
            type="text" 
            placeholder="Ingresa tu nombre"
              class="custom-input">
            </ion-input>
          </ion-col>

          <ion-col size="6">
            <ion-input 
            label="Apellido"
            [(ngModel)]="lastname"
            label-placement="floating" 
            fill="outline" 
            type="text"
              placeholder="Ingresa tu apellido" 
              class="custom-input">
            </ion-input>
          </ion-col>
        </ion-row>
      </ion-grid> 
      
      <ion-input 
      label="Email"
      [(ngModel)]="email" 
      label-placement="floating" 
      fill="outline" 
      type="email"
        placeholder="usuario@email.com" 
        class="custom-input ion-margin-top">
      </ion-input>

      <ion-input 
      label="Contraseña"
      [(ngModel)]="password" 
      label-placement="floating" 
      fill="outline" 
      type="password"
        placeholder="Ingresa tu contraseña" 
        class="custom-input ion-margin-top">
      </ion-input>

      <ion-input 
      label="Repite tu contraseña"
      [(ngModel)]="repeatPassword" 
      label-placement="floating" 
      fill="outline" 
      type="password"
        placeholder="Repite tu contraseña" 
        class="custom-input ion-margin-top"
      [color]="(repeatPassword && password !== repeatPassword) ? 'danger' : ''">
      </ion-input>

      <ion-item
      class="terms-container ion-margin-vertical"
      lines="none"
      style="--background: transparent; background: transparent;">
        <ion-checkbox
        [(ngModel)]="termsAccepted" 
        mode="md" 
        label-placement="end"
        style="
          --background: transparent; 
          --border-color: var(--ion-color-medium); 
          --background-checked: var(--ion-color-primary);
          --border-color-checked: var(--ion-color-primary);
        "
        >
          <p style="font-size: 0.85rem; white-space: normal; margin: 0; color: var(--ion-color-step-600);">Estoy de acuerdo con los <span style="color: #4d8dff;">términos y condiciones</span></p>
        </ion-checkbox>
      </ion-item>
    </div>

    <ion-button 
    (click)="handleSignUp()"
    expand="block" 
    color="primary" 
    class="main-button">
      Crear cuenta
    </ion-button>

    <p 
    class="ion-text-center login-footer">
      ¿Ya tienes una cuenta? <a routerLink="/login"> Inicia sesión</a>
    </p>

  </div>
</ion-content>
