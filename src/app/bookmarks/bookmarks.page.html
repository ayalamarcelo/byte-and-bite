<ion-content class="bookmarks-content">

  <div class="search-container">
    <ion-button fill="clear" routerLink="/tabs/home" class="home-btn">
      <ion-icon slot="icon-only" name="chevron-back-outline"></ion-icon>
    </ion-button>
    <ion-searchbar 
      placeholder="Buscar alimentos..." 
      mode="ios"
      [(ngModel)]="busqueda"
      (ionInput)="buscar($event)">
    </ion-searchbar>
  </div>

  <div class="filter-buttons">
    <ion-button fill="outline" size="small" shape="round"
      [class.active]="filtroActivo === 'Todos'"
      (click)="setFiltro('Todos')">Todos</ion-button>
    <ion-button fill="outline" size="small" shape="round"
      [class.active]="filtroActivo === 'Carbohidratos'"
      (click)="setFiltro('Carbohidratos')">Carbohidratos</ion-button>
    <ion-button fill="outline" size="small" shape="round"
      [class.active]="filtroActivo === 'Proteínas'"
      (click)="setFiltro('Proteínas')">Proteínas</ion-button>
    <ion-button fill="outline" size="small" shape="round"
      [class.active]="filtroActivo === 'Grasas'"
      (click)="setFiltro('Grasas')">Grasas</ion-button>
    <ion-button fill="outline" size="small" shape="round"
      [class.active]="filtroActivo === 'Vitaminas'"
      (click)="setFiltro('Vitaminas')">Vitaminas</ion-button>
  </div>

  <div class="empty-state" *ngIf="alimentosMostrados.length === 0 && !buscando">
    <ion-icon name="bookmark-outline"></ion-icon>
    <p>No hay alimentos en esta categoría</p>
  </div>

  <div class="buscando" *ngIf="buscando">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <ion-list class="bookmarks-list">
    <ion-card class="bookmark-card" *ngFor="let alimento of alimentosMostrados">
      <img [src]="alimento.img" [alt]="alimento.nombre">
      <div class="card-badge">{{ alimento.categoria }}</div>
      <ion-card-content>
        <div class="card-info">
          <h3>{{ alimento.nombre }}</h3>
          <div class="card-meta">
            <span class="calories">🔥 {{ alimento.kcal }} kcal</span>
            <span class="separator">·</span>
            <span>{{ alimento.gramos }}g</span>
          </div>
        </div>
        <div class="card-actions">
          <ion-button fill="clear" class="add-btn" (click)="toggleMenu(alimento)">
            <ion-icon slot="icon-only" name="add-circle-outline" color="primary"></ion-icon>
          </ion-button>
          <ion-button fill="clear" class="remove-btn">
            <ion-icon slot="icon-only" name="bookmark" color="primary"></ion-icon>
          </ion-button>
        </div>
      </ion-card-content>
      <div class="gramos-menu" *ngIf="alimento.menuAbierto">
        <p>¿Cuántos gramos querés comer?</p>
        <div class="gramos-input">
          <ion-input
            type="number"
            placeholder="Ej: 150"
            [(ngModel)]="alimento.gramosSeleccionados"
            fill="outline"
            label="Gramos"
            label-placement="floating">
          </ion-input>
        </div>
        <ion-button expand="block" size="small" (click)="agregarAlHome(alimento)">
          Agregar al registro
        </ion-button>
        <p *ngIf="alimento.gramosSeleccionados" class="gramos-selected">
          Seleccionaste {{ alimento.gramosSeleccionados }}g
        </p>
      </div>
    </ion-card>
  </ion-list>

</ion-content>
