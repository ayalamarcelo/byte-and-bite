<!-- Contenedor principal de la página de favoritos -->
<ion-content class="bookmarks-content">

  <!-- Sección superior: Barra de búsqueda -->
  <div class="search-container">
    <!-- Barra de búsqueda que actualiza la variable 'busqueda' y dispara el método 'buscar()' -->
    <ion-searchbar 
      placeholder="Buscar alimentos..." 
      mode="md"
      [(ngModel)]="busqueda"
      (ionInput)="buscar($event)">
    </ion-searchbar>
  </div>

  <!-- Botones de filtro por categoría (Todos, Carbohidratos, Proteínas, etc.) -->
  <div class="filter-buttons">
    <ion-button fill="outline" size="small" shape="round"
      [class.active]="filtroActivo === 'Todos'"
      (click)="setFiltro('Todos')">Todos</ion-button>
    <ion-button fill="outline" size="small" shape="round"
      [class.active]="filtroActivo === 'Carbohidratos'"
      (click)="setFiltro('Carbohidratos')">Carbohidratos</ion-button>
    <ion-button fill="outline" size="small" shape="round"
      [class.active]="filtroActivo === 'Proteínas'"
      (click)="setFiltro('Proteínas')">Proteínas</ion-button>
    <ion-button fill="outline" size="small" shape="round"
      [class.active]="filtroActivo === 'Grasas'"
      (click)="setFiltro('Grasas')">Grasas</ion-button>
    <ion-button fill="outline" size="small" shape="round"
      [class.active]="filtroActivo === 'Vitaminas'"
      (click)="setFiltro('Vitaminas')">Vitaminas</ion-button>
  </div>

  <!-- Mensaje que se muestra cuando no hay alimentos guardados en la categoría seleccionada -->
  <div class="empty-state" *ngIf="alimentosMostrados.length === 0 && !buscando">
    <ion-icon name="bookmark-outline"></ion-icon>
    <p>No hay alimentos en esta categoría</p>
  </div>

  <!-- Indicador de carga (spinner) que se muestra mientras se está buscando información -->
  <div class="buscando" *ngIf="buscando">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <!-- Lista de alimentos guardados en favoritos -->
  <ion-list class="bookmarks-list">
    <!-- Componente deslizante para cada alimento (permite revelar botones al deslizar) -->
    <ion-item-sliding *ngFor="let alimento of alimentosMostrados">
      
      <!-- Opciones al deslizar hacia la derecha (Botón de eliminar) -->
      <ion-item-options side="start">
        <ion-item-option color="danger" expandable (click)="eliminarBookmark(alimento)">
          <ion-icon slot="icon-only" name="trash"></ion-icon>
        </ion-item-option>
      </ion-item-options>

      <!-- Elemento de la lista que contiene la tarjeta del alimento -->
      <ion-item lines="none" class="bookmark-item">
        <ion-card class="bookmark-card">
          <!-- Imagen y etiqueta de categoría del alimento -->
          <img [src]="alimento.img" [alt]="alimento.nombre">
          <div class="card-badge">{{ alimento.categoria }}</div>
          
          <ion-card-content>
            <div class="card-info">
              <!-- Nombre, calorías y cantidad base del alimento -->
              <h3>{{ alimento.nombre }}</h3>
              <div class="card-meta">
                <span class="calories">🔥 {{ alimento.kcal }} kcal</span>
                <span class="separator">·</span>
                <span>{{ alimento.gramos }}g</span>
              </div>
            </div>
            
            <div class="card-actions">
              <!-- Botón para abrir el menú de selección de gramos (agregar al registro) -->
              <ion-button fill="clear" class="add-btn" (click)="toggleMenu(alimento)">
                <ion-icon slot="icon-only" name="add-circle-outline" color="primary"></ion-icon>
              </ion-button>
              <!-- Botón para quitar el alimento de favoritos -->
              <ion-button fill="clear" class="remove-btn" (click)="eliminarBookmark(alimento)">
                <ion-icon slot="icon-only" name="bookmark" color="primary"></ion-icon>
              </ion-button>
            </div>
          </ion-card-content>

          <!-- Menú desplegable para ingresar gramos (Aparece al presionar el botón '+') -->
          <div class="gramos-menu" *ngIf="alimento.menuAbierto">
            <p>¿Cuántos gramos querés comer?</p>
            <div class="gramos-input">
              <!-- Input para que el usuario escriba la cantidad en gramos -->
              <ion-input
                type="number"
                placeholder="Ej: 150"
                [(ngModel)]="alimento.gramosSeleccionados"
                fill="outline"
                label="Gramos"
                label-placement="floating">
              </ion-input>
            </div>
            <!-- Botón para confirmar y agregar los gramos ingresados al contador de calorías -->
            <ion-button expand="block" size="small" (click)="agregarAlHome(alimento)">
              Agregar al registro
            </ion-button>
            <!-- Mensaje que confirma cuántos gramos se han seleccionado -->
            <p *ngIf="alimento.gramosSeleccionados" class="gramos-selected">
              Seleccionaste {{ alimento.gramosSeleccionados }}g
            </p>
          </div>
        </ion-card>
      </ion-item>

      <!-- Opciones al deslizar hacia la izquierda (Botón de eliminar) -->
      <ion-item-options side="end">
        <ion-item-option color="danger" expandable (click)="eliminarBookmark(alimento)">
          <ion-icon slot="icon-only" name="trash"></ion-icon>
        </ion-item-option>
      </ion-item-options>

    </ion-item-sliding>
  </ion-list>

</ion-content>
